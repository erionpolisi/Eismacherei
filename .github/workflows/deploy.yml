name: Deploy to easyname

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server:     ${{ secrets.SFTP_HOST }}
          port:       ${{ secrets.SFTP_PORT }}
          username:   ${{ secrets.SFTP_USERNAME }}
          password:   ${{ secrets.SFTP_PASSWORD }}
          local_path: ./
          remote_path: /data/web/e144814/html
          sftp_only:  true
          delete: true
          rsyncArgs: '--exclude=.git --exclude=.github --exclude=node_modules --exclude=*.log --exclude=*.md --exclude=*.txt' 