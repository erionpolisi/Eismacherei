<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mergenthalerplatz</title>

  <!-- Standard Favicon -->
  <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico?v=1">

  <!-- PNG Favicons -->
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png?v=1">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png?v=1">

  <!-- Apple Touch Icon (für iOS, iPadOS Homescreen) -->
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png?v=1">

  <!-- Android / Progressive Web App -->
  <link rel="manifest" href="assets/img/site.webmanifest">
  
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/hours.css">
</head>

<body>

    <a href="index.html" class="back-button" id="zrk-btn">← Zurück</a>

  <section class="hours-section">
    <div class="container">
        <div class="section-header">
            <h2 class="section-title">Mergenthalerplatz</h2>
            <p class="section-subtitle">Täglich geöffnet, auch an Sonn- und Feiertagen!</p>
        </div>          

      <div class="hours-content">
        <p>März, April, Oktober</p>
        <h3 class="hours-time">Mo–So: 11 bis 20 Uhr</h3>

        <p>Mai, September</p>
        <h3 class="hours-time">Mo–So: 11 bis 21 Uhr</h3>

        <p>Juni</p>
        <h3 class="hours-time">Mo–Fr: 09 bis 22 Uhr<br>Sa–So: 11 bis 22 Uhr</h3>

        <p>Juli, August</p>
        <h3 class="hours-time">Mo–So: 11 bis 22 Uhr</h3>

        <p>November – Februar</p>
        <h3 class="hours-time">Geschlossen</h3>
      </div>


      <div id="status" style="margin-top: 2rem; font-size: 1.2rem; font-weight: bold;"></div> <!--Öffnungszeiten-->

    </div>
  </section>

  <script>
    function checkOpenStatus() {
      const now = new Date();
      const month = now.getMonth(); // Jan = 0
      const hour = now.getHours();
      const day = now.getDay(); // So = 0, Mo = 1
      const status = document.getElementById('status');

      let openHour = null;
      let closeHour = null;

      // Nov – Feb: geschlossen
      if ([10, 11, 0, 1].includes(month)) {
        status.innerText = "Derzeit geschlossen (Winterpause)";
        status.style.color = "black";
        return;
      }

      // März, April, Oktober → 11–20
      if ([2, 3, 9].includes(month)) {
        openHour = 11;
        closeHour = 20;
      }

      // Mai, September → 11–21
      else if ([4, 8].includes(month)) {
        openHour = 11;
        closeHour = 21;
      }

      // Juli, August → 11–22
      else if ([6, 7].includes(month)) {
        openHour = 11;
        closeHour = 22;
      }

      // Juni → Mo–Fr 9–22, Sa–So 11–22
      else if (month === 5) {
        if (day >= 1 && day <= 5) {
          openHour = 9;
          closeHour = 22;
        } else {
          openHour = 11;
          closeHour = 22;
        }
      }

      if (openHour === null || closeHour === null) return;

      const isOpen = hour >= openHour && hour < closeHour;
      status.innerText = isOpen ? "Wir haben geöffnet!" : "Gerade geschlossen";
      status.style.color = isOpen ? "green" : "black";
    }

    checkOpenStatus();
  </script>
</body>

</html>
