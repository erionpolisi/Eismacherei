<body>

    <a href="javascript:history.back()" class="back-button" id="zrk-btn">← Zurück</a>

  <section class="hours-section">
    <div class="container">
        <div class="section-header">
            <h2 class="section-title">Mergenthalerplatz</h2>
            <p class="section-subtitle">Täglich geöffnet, auch an Sonn- und Feiertagen!</p>
        </div>          

      <div class="hours-content">
        <p>März, April, September</p>
        <h3 class="hours-time">11 bis 20 Uhr</h3>

        <p>Mai, Juli, August</p>
        <h3 class="hours-time">10 bis 22 Uhr</h3>

        <p>Juni</p>
        <h3 class="hours-time">9 bis 22 Uhr</h3>

        <p>Oktober</p>
        <h3 class="hours-time">Je nach Wetterlage</h3>

        <p>November, Dezember, Januar, Februar</p>
        <h3 class="hours-time">Geschlossen</h3>
      </div>


      <div id="status" style="margin-top: 2rem; font-size: 1.2rem; font-weight: bold;"></div> <!--Öffnungszeiten-->

    </div>
  </section>
</body>

<script>
function checkOpenStatus() {
  const now = new Date();
  const month = now.getMonth(); // Jan = 0
  const hour = now.getHours();
  const status = document.getElementById('status');

  let openHour = null;
  let closeHour = null;
  let message = "";

  // November – Februar: geschlossen
  if ([10, 11, 0, 1].includes(month)) {
    status.innerText = "Derzeit geschlossen (Winterpause)";
    status.style.color = "black";
    return;
  }

  // März, April, September → 11–20
  if ([2, 3, 8].includes(month)) {
    openHour = 11;
    closeHour = 20;
  }

  // Mai, Juli, August → 10–22
  else if ([4, 6, 7].includes(month)) {
    openHour = 10;
    closeHour = 22;
  }

  // Juni → 9–22
  else if (month === 5) {
    openHour = 9;
    closeHour = 22;
  }

  // Oktober → wetterabhängig
  else if (month === 9) {
    status.innerText = "Öffnungszeiten im Oktober je nach Wetterlage";
    status.style.color = "black";
    return;
  }

  const isOpen = hour >= openHour && hour < closeHour;
  status.innerText = isOpen ? "Wir haben geöffnet!" : "Gerade geschlossen";
  status.style.color = isOpen ? "green" : "black";
}

checkOpenStatus();
</script>
